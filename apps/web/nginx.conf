# Log sin query string: los links de invitación y reseteo llevan el token en ?token=, no debe quedar en logs.
log_format noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 80;
  access_log /var/log/nginx/access.log noquery;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass http://api:3000;
  }

  location = /openapi.json {
    proxy_pass http://api:3000;
  }

  # Rutas de la SPA (React Router): cualquier otra ruta devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
